<!doctype html>
<!--
  SlashForge document shell.

  Installed verbatim alongside the guide files and used for every HTML artefact
  SlashForge writes: investigation reports, design specs, and implementation
  plans. The caller writes ONLY the body fragment and splices it in here, so the
  CSS is never regenerated per document — that keeps them visually identical and
  keeps the boilerplate out of the model's output.

  Two comment markers below are substituted, and they are NOT treated alike:

    TITLE   (in the head) is the FULL title, prefix included — e.g.
            "Investigation — <symptom> (<date>)" or "Design — <topic>". It MUST be
            HTML-escaped first — & then < then >. It is plain text from a
            user-supplied symptom; unescaped, a "</title>" in it ends the
            element early and the remainder leaks in as markup, and entity-
            shaped text like "&amp;" is decoded into something else.
    CONTENT (in the body) takes the fragment verbatim. It is real HTML and
            must NOT be escaped.

  Substitute both with function-form replacement so $-sequences in the fragment
  are not interpreted as replacement patterns.

  Keep this file self-contained: no scripting, no external stylesheets, no CDN
  links, no remote fonts or images. It must render identically when opened from
  disk with no network. A test asserts this.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         max-width: 880px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.55;
         color: #1f2328; background: #fff; }
  h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.2rem; margin-top: 2rem; border-bottom: 1px solid #d0d7de; padding-bottom: 0.25rem; }
  .summary { padding: 0.6rem 0.9rem; border-left: 4px solid #1a7f37; background: #f6f8fa;
             margin: 1rem 0; font-weight: 500; }
  .summary.unreproducible { border-left-color: #9a6700; }
  .summary.intended       { border-left-color: #57606a; }
  .summary.needs-info     { border-left-color: #0969da; }
  code { font-family: "SF Mono", Menlo, Consolas, monospace; background: #f6f8fa;
         padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.9em; }
  pre { background: #f6f8fa; padding: 0.75rem 1rem; border-radius: 6px; overflow-x: auto; }
  pre code { background: transparent; padding: 0; }
  ul, ol { padding-left: 1.25rem; }
  table { border-collapse: collapse; width: 100%; margin: 0.5rem 0 1rem; }
  th, td { border: 1px solid #d0d7de; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
  th { background: #f6f8fa; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    h2 { border-bottom-color: #30363d; }
    .summary { background: #161b22; }
    th, td { border-color: #30363d; }
    th { background: #161b22; }
    code, pre { background: #161b22; }
    a { color: #58a6ff; }
  }
</style>
</head>
<body>

<!--CONTENT-->

</body>
</html>
