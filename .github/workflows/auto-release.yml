name: Auto-release

on:
  push:
    branches: [main]
    paths: ['package.json']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read package version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create release if tag is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping."
          else
            gh release create "$tag" --generate-notes --title "$tag"
            # A release created by GITHUB_TOKEN does not trigger other
            # workflows, so dispatch the publish workflow explicitly.
            gh workflow run publish.yml -f tag="$tag"
          fi
