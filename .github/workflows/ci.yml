name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: npm test

  # The docs are a separate workspace with their own dependencies, so `npm test`
  # says nothing about whether they still build. Without this, broken frontmatter
  # or an unresolvable sidebar slug merges green and only fails at deploy — and a
  # major Astro bump can land with no coverage at all.
  #
  # Node is pinned separately here: Astro 7 requires >=22.12, while the matrix
  # above covers the versions the published CLI supports.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      # Also exercises the prebuild step that generates the changelog page from
      # the repo-root CHANGELOG.md.
      - name: Build docs
        run: npm run build
        working-directory: docs

      # Astro does not fail a build on a dead in-page link, so those ship
      # silently — which is exactly what a base-path or slug rename breaks.
      - name: Check internal links resolve
        working-directory: docs
        run: node ../.github/scripts/check-docs-links.mjs

      # An icon-only control with no accessible name renders correctly, so it
      # survives review. The header socials shipped unnamed on every page.
      - name: Check interactive elements have accessible names
        working-directory: docs
        run: node ../.github/scripts/check-docs-a11y.mjs
